<body>
  <header>
    <h1 class="titulu">Sirius</h1>
    <a href="pagina.html">
      <input class="conta" type="button" name="login" value="Login" />
    </a>
  </header>

  <main>
    <h1 class="gerenciador">OrganizaMe</h1>
    <h2>Gerencie suas tarefas</h2>

    <section>
      <form id="formulario">
        <label for="item"><strong>Comece sua lista:</strong></label><br />
        <div class="separador">
          <input class="escrever" type="text" id="item" placeholder="Digite um item" />
          <input class="data" type="date" id="data" />
          <button type="submit">Enviar</button>
        </div>
      </form>

      <div class="separador">
        <label for="filtro">
         <strong>filtrar:</strong>
        </label>
        <select name="filtro" id="">
          <option value="todas">todas</option>
          <option value="concluida">concluida</option>
          <option value="pendente">pendente</option>
          <option value="atrasada">atrasada</option>
        </select>
      </div>

      <ul class="lita" id="lista"></ul>

      <div id="contador" style="text-align: center; margin-top: 15px; font-size: 18px;">
        total: 0 | pendente: 0 | concluidas: 0
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>


  <script>
    const form = document.getElementById("formulario");
    const lista = document.getElementById("lista");
    const input = document.getElementById("item");
    const inputData = document.getElementById("data");

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      adicionar();
    });

    function adicionar() {
      const texto = input.value.trim();
      const data = inputData.value;

      if (texto !== "") {
        const li = document.createElement("li");

        // bloco com texto + data
        const divInfo = document.createElement("div");
        divInfo.classList.add("task-info");

        const spanTexto = document.createElement("span");
        spanTexto.textContent = texto;
        divInfo.appendChild(spanTexto);

        if (data) {
          const spanData = document.createElement("span");

          // formatar data YYYY-MM-DD → DD/MM/YYYY
          const partes = data.split("-");
          const dataFormatada = `${partes[2]}/${partes[1]}/${partes[0]}`;

          spanData.textContent = "Data: " + dataFormatada;
          spanData.classList.add("task-date");
          divInfo.appendChild(spanData);
        }

        // botão remover
        const btn = document.createElement("button");
        btn.textContent = "Remover";
        btn.classList.add("remove-btn");
        btn.onclick = function () {
          li.remove();
          atualizarContador();
        };

        li.appendChild(divInfo);
        li.appendChild(btn);
        lista.appendChild(li);

        input.value = "";
        inputData.value = "";
        input.focus();
      }
    }

    new Sortable(lista, {
      animation: 150,
      ghostClass: "dragging", // classe aplicada ao item enquanto arrasta
    });

    const checkbox =
document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.onchange = () => {
      li.ClassList.toggle("concluida",
    checkbox.checked);
    aplicarFiltro();
    atualizarContador();
    }

      const tipo = filtro.value;

      itens.foreach(li => {
        const concluida = li.classList.contains("concluida");
        const spanData = li.querySelector(".task-data");
        const data = spandata ? spanData.dataset.raw : null;

        let mostar = true;

        if(tipo === "concluidas" && ! concluida) mostar = false;
        if(tipo === "pendentas" && ! concluida) mostar = false;
        if(tipo === "hoje" && ! concluida) mostar = false;
        if(tipo === "atrasadas" && ! concluida) mostar = false;

      })

     function atualizarContador (){
      const itens = lista.querySelectorAll("li");
      let total = itens.length;
      let concluidas = lista.querySelectorAll("li.concluida").length;

      let pendentes = total - concluidas;

      contador.textContent = 'total ${total} | pendentes${pendentes} | concluidas: ${concluidas}';
     }

  </script>
</body>
